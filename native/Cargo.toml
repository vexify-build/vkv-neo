[package]
name = "vkv-native"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "vkv-neo native N-API engine (.node). Powered By Vexify."

[lib]
name = "vkv_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vkv-core = { path = "../core" }
napi-sys = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true